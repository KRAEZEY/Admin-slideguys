<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Slide Guys Admin Login</title>
<style>body{font-family:Arial,sans-serif;background:#f3f3f3;margin:0;padding:24px}main{max-width:380px;margin:60px auto;background:white;padding:28px;border-radius:12px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 16px}button{cursor:pointer}#status{line-height:1.5}</style></head>
<body><main><h1>Admin Login</h1><form id="login-form"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required><button id="submit" type="submit">Log In</button></form><p id="status" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const bookingClient = supabase.createClient(
      'https://vaobmohukgcqfvnclqyh.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZhb2Jtb2h1a2djcWZ2bmNscXloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ3NTcyNzksImV4cCI6MjA2MDMzMzI3OX0.6pl5QBTVUr8wu3bn4kXhI2kPE5qf97PrIbUw7-0382M'
    );
document.getElementById('login-form').addEventListener('submit', async e => {
 e.preventDefault();
 const button = document.getElementById('submit'), status = document.getElementById('status');
 button.disabled = true; status.textContent = 'Signing in…';
 try {
  const {error} = await bookingClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
  if (error) throw new Error('Login failed. Please check your email and password.');
  const result = await bookingClient.rpc('sg_is_admin');
  if (result.error || result.data !== true) {
   await bookingClient.auth.signOut();
   throw new Error('Admin access could not be verified. Contact the site owner if this is your admin account.');
  }
  window.location.replace('dashboard.html');
 } catch(error) { status.textContent = error.message || 'Unable to sign in. Please try again.'; }
 finally {button.disabled=false;document.getElementById('password').value='';}
});
</script></body></html>
